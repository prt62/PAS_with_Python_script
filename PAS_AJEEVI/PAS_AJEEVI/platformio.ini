[env:esp32-poe]
platform = espressif32
board = esp32-poe
framework = arduino

; Match your Serial.begin speed
monitor_speed = 115200

; ---> THE MAGIC FIX: Give the app 3MB of Flash Space! <---
board_build.partitions = huge_app.csv

; Auto-Install ONLY the Audio Library
lib_deps = 
	earlephilhower/ESP8266Audio @ ^1.9.7